name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
      # Build only, no push, no deploy: this is where the Dockerfile is
      # verified (PRs included). Deploys pull GHCR images in Dokploy.
      - run: docker build -f Dockerfile .

  # `queek app deploy` pushes the toml and cuts version N+1. Runs only when
  # the automation token exists — otherwise registration stays a manual
  # `queek app deploy` from a logged-in checkout. The token is a per-app App
  # Automation Token from the Developer page (Dashboard → Developers → your
  # app → Automation tokens); a 403 means it belongs to a different app.
  # NOTE: needs a @usequeek/cli that ships `app deploy` (0.9.0 predates it).
  deploy:
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `secrets` is not allowed in a job-level `if:` — map it to env and gate the steps.
    env:
      QUEEK_APP_AUTOMATION_TOKEN: ${{ secrets.QUEEK_APP_AUTOMATION_TOKEN }}
    steps:
      - if: env.QUEEK_APP_AUTOMATION_TOKEN == ''
        run: echo "QUEEK_APP_AUTOMATION_TOKEN is not set — skipping queek app deploy."
      - if: env.QUEEK_APP_AUTOMATION_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.QUEEK_APP_AUTOMATION_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - if: env.QUEEK_APP_AUTOMATION_TOKEN != ''
        run: npx -y @usequeek/cli app deploy
