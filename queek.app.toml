slug = "my-app"
name = "My App"
distribution = "public"
icon = "wave"
developer = "You"

[listing]
description = "What your app does, in one sentence."
tagline = "One line for the listing."

[access]
scopes = ["merchant-business_profile-read"]

[webhooks]
topics = ["orders/updated"]
url = "https://my-app.apps.queek.com.ng/webhooks"

[app]
install_url = "https://my-app.apps.queek.com.ng/install"
uninstall_url = "https://my-app.apps.queek.com.ng/uninstall"
settings_url = "https://my-app.apps.queek.com.ng/settings"

[[settings]]
key = "greeting"
label = "Greeting"
type = "string"
required = false
help = "Logged when an order update arrives."

[extensions]
merchant_page_url = "https://my-app.apps.queek.com.ng/admin"

# NOTE: no [[extensions.nav]] entries ship yet, but they are deployable:
# the live backend validator (AppManifestValidator::validateExtensions on
# origin/master) allows proxy/blocks/merchant_page_url/nav and checks nav
# with validateNav — every path must live under the merchant_page_url path
# prefix (5-round decode, no `..`/scheme/backslash), so entries like
# `{ label = "Settings", path = "/admin/settings" }` pass `queek app deploy`.
# tests/toml.test.ts mirrors that validator subset.

[dev]
command = "node ./server.js"
port = 3000
