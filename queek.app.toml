slug = "my-app"
name = "My App"
distribution = "public"
icon = "wave"
developer = "You"

[listing]
description = "What your app does, in one sentence."
tagline = "One line for the listing."

[access]
scopes = ["merchant-business_profile-read"]

[webhooks]
topics = ["orders/updated"]
url = "https://my-app.apps.queek.com.ng/webhooks"

[app]
install_url = "https://my-app.apps.queek.com.ng/install"
uninstall_url = "https://my-app.apps.queek.com.ng/uninstall"
settings_url = "https://my-app.apps.queek.com.ng/settings"

[[settings]]
key = "greeting"
label = "Greeting"
type = "string"
required = false
help = "Logged when an order update arrives."

[extensions]
merchant_page_url = "https://my-app.apps.queek.com.ng/admin"

# No [[extensions.nav]] entries ship yet, but they are deployable: every nav
# path must live under the merchant_page_url path prefix (decoded fully, with
# no `..`, scheme or backslash), so an entry like
# `{ label = "Settings", path = "/admin/settings" }` passes `queek app deploy`.
# tests/toml.test.ts checks the same rules locally.

[dev]
command = "node ./server.js"
port = 3000
